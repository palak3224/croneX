<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e1e"/>
      <stop offset="100%" stop-color="#3a3a3a"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Center Text -->
  <text x="512" y="430" text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="110"
        font-weight="bold"
        fill="#111827">
    aws
  </text>

  <path d="M380 470 Q512 540 650 470"
        stroke="#ff9900"
        stroke-width="12"
        fill="none"
        stroke-linecap="round"/>

  <text x="512" y="600" text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="120"
        font-weight="bold"
        fill="#111827">
    creatr
  </text>

  <!-- Rocket -->
  <g transform="translate(180,180)">
    <ellipse cx="60" cy="80" rx="40" ry="80" fill="#ffffff" stroke="#1f2937" stroke-width="6"/>
    <polygon points="60,0 90,50 30,50" fill="#ff9900"/>
    <circle cx="60" cy="90" r="14" fill="#8b5cf6"/>
    <polygon points="20,120 0,160 30,140" fill="#ff9900"/>
    <polygon points="100,120 120,160 90,140" fill="#ff9900"/>
    <polygon points="45,160 75,160 60,220" fill="#ff9900"/>
  </g>

  <!-- Cloud -->
  <g transform="translate(650,170)">
    <circle cx="50" cy="50" r="40" fill="#dbeafe"/>
    <circle cx="100" cy="50" r="50" fill="#dbeafe"/>
    <circle cx="150" cy="60" r="35" fill="#dbeafe"/>
    <rect x="40" y="60" width="140" height="40" fill="#dbeafe"/>
    <path d="M110 30 L140 60 L120 60 L120 100 L100 100 L100 60 L80 60 Z"
          fill="#1f2937"/>
  </g>

  <!-- Laptop -->
  <g transform="translate(120,620)">
    <rect x="0" y="0" width="180" height="110" rx="12" fill="#e5e7eb" stroke="#111827" stroke-width="5"/>
    <rect x="20" y="20" width="140" height="70" fill="#c4b5fd"/>
    <rect x="-20" y="110" width="220" height="20" rx="10" fill="#9ca3af"/>
  </g>

  <!-- Robot Arm -->
  <g transform="translate(700,650)">
    <rect x="50" y="120" width="100" height="30" fill="#9ca3af"/>
    <circle cx="70" cy="100" r="25" fill="#d1d5db" stroke="#111827" stroke-width="5"/>
    <line x1="70" y1="100" x2="130" y2="50" stroke="#d1d5db" stroke-width="20"/>
    <circle cx="130" cy="50" r="20" fill="#d1d5db" stroke="#111827" stroke-width="5"/>
    <line x1="130" y1="50" x2="190" y2="10" stroke="#d1d5db" stroke-width="18"/>
    <circle cx="190" cy="10" r="16" fill="#d1d5db" stroke="#111827" stroke-width="5"/>
  </g>

  <!-- Decorative circles -->
  <circle cx="850" cy="350" r="12" fill="#ff9900"/>
  <circle cx="180" cy="520" r="10" fill="#8b5cf6"/>
  <circle cx="780" cy="820" r="14" fill="#ff9900"/>
</svg>
